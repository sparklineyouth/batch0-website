# Typecheck and tests on every pull request and every push to main.
#
# Vercel already builds each branch, so this does not repeat the build: it runs
# what Vercel never does. Without it the Fall schedule test sat red on every UTC
# machine for a week, green only on laptops in U.S. time. The runner is UTC,
# which is the point: it matches Supabase and Vercel, not a developer's laptop.
#
# Everything here is hermetic (PGlite in memory, no network, no secrets), so it
# needs nothing from the repository settings. The one exception is the
# migration-version step on pull requests: it reads main's and the other open
# pull requests' migration files from GitHub's API, with the workflow's own
# read-only token.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Database tests
        run: |
          npm run test:scholarships-db
          npm run test:profile-privileges-db
          npm run test:call-cohosts-db
          npm run test:calls-db
          npm run test:sms-messaging-db
          npm run test:migrations-replay-db
          npm run test-blast-addressing
          node --test scripts/cohort-readiness-winter.test.mjs
      # Two branches that each take the next free migration number both pass
      # the tests above, and the second to merge breaks Supabase's integration
      # (docs/migrations-2026-10.md, "Versions"). Read live, so re-running the
      # job re-checks against main and the open pull requests as they are now.
      - name: Migration versions (main and open pull requests)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:migration-versions
