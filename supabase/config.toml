# Marks this directory as the Supabase project root.
#
# Without it the CLI walks UP looking for a config and lands somewhere else
# entirely — before this file existed, `supabase migration list` run from this
# repo printed "Using workdir /Users/rishabhdagli" and an empty "Local" column,
# because it resolved to a stray scaffold in the home directory. Every command
# then needed an explicit --workdir to behave. Now `supabase db push` and
# friends work from the project root the way you'd expect.
#
# Deliberately minimal: this project has no local Supabase stack: migrations
# are written here and pushed to the linked remote (`supabase/.temp/`). There
# is nothing to configure for `supabase start`, and inventing port numbers and
# service settings for a stack nobody runs would be fiction. Add sections here
# if local development ever becomes real.
#
# `/supabase` is listed in .vercelignore, so this costs the deploy nothing.
#
# Applying migrations: prefer `npm run db:migrate` (scripts/db-migrate.mts),
# which tells live-but-unrecorded files apart from pending ones by their
# verify queries, backs up first and records what it runs. The CLI way:
#   supabase db push --dry-run   # confirm the list is ONLY what you expect
#   supabase db push
# Supabase's GitHub integration runs the same push (with --include-all)
# against production on every push to main, so a file on main gets applied
# whether or not anyone runs it (docs/migrations-2026-10.md, "Versions"; no
# two files may share a version).
#
# Check state first with `supabase migration list` — every row should carry a
# value in BOTH Local and Remote. A row with a Local value and a blank Remote
# is genuinely pending. A row with a blank Local is a file you don't have.
#
# If a migration is already live but unrecorded (this happened to 0040-0048),
# repair the history rather than pushing — a push would re-execute it:
#   supabase migration repair --status applied 0040 0041 ...
# Only once its file is on main: a recorded version main has no file for
# stops the GitHub integration on every push until it lands.

project_id = "batch0"
